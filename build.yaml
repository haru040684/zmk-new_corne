    shield: eyelash_corne_left nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n -DCONFIG_ZMK_SETTINGS_RPC_STUDIO=n -DCONFIG_ZMK_RUNTIME_SENSOR_ROTATE=n -DCONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=n
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n -DCONFIG_ZMK_SETTINGS_RPC_STUDIO=n
  - board: nice_nano_v2
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: eyelash_corne_dongle prospector_adapter
